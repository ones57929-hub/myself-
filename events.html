<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفعاليات - NexEvent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#9b59b6;--secondary:#8e44ad;--dark:#1a1a1a;--light:#f8f9fa;--white:#ffffff;--gray:#6c757d;--shadow:0 4px 6px rgba(0,0,0,0.1);--radius:12px}
body{font-family:'Cairo',sans-serif;background:var(--light);color:var(--dark);line-height:1.6}
.navbar{background:var(--white);box-shadow:var(--shadow);position:sticky;top:0;z-index:1000;padding:15px 0}
.nav-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;text-decoration:none}
.logo i{font-size:2rem;color:var(--primary)}
.nav-menu{display:flex;list-style:none;gap:5px;align-items:center}
.nav-menu a{padding:10px 18px;border-radius:var(--radius);font-weight:600;transition:all 0.3s;display:flex;align-items:center;gap:8px;color:var(--dark);text-decoration:none}
.nav-menu a:hover,.nav-menu a.active{background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--white)}
.nav-toggle{display:none;background:none;border:none;font-size:1.5rem;cursor:pointer}
.user-info{display:flex;align-items:center;gap:10px;padding:10px 15px;background:var(--light);border-radius:var(--radius)}
.user-info i{color:var(--primary)}
.user-info span{font-weight:600}
.container{max-width:1200px;margin:0 auto;padding:40px 20px}
.page-header{margin-bottom:40px}
.page-header h1{font-size:2.5rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.page-header p{color:var(--gray);font-size:1.1rem}
.filters{background:var(--white);padding:25px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:40px;display:flex;gap:15px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:12px 20px;border:2px solid #e0e0e0;border-radius:var(--radius);font-family:inherit;font-size:1rem;cursor:pointer;transition:all 0.3s}
.filters select:focus,.filters input:focus{outline:none;border-color:var(--primary)}
.filters button{background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--white);border:none;padding:12px 30px;border-radius:var(--radius);font-weight:700;cursor:pointer;transition:all 0.3s}
.filters button:hover{transform:translateY(-2px);box-shadow:0 5px 15px rgba(155,89,182,0.3)}
.results-count{color:var(--gray);margin-bottom:20px;font-size:1.05rem}
.events-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:30px}
.event-card{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:all 0.3s;cursor:pointer}
.event-card:hover{transform:translateY(-8px);box-shadow:0 12px 24px rgba(0,0,0,0.15)}
.event-image{height:200px;background:linear-gradient(135deg,var(--primary),var(--secondary));position:relative;overflow:hidden}
.event-image img{width:100%;height:100%;object-fit:cover}
.event-badge{position:absolute;top:15px;right:15px;background:rgba(142,68,173,0.95);color:var(--white);padding:6px 15px;border-radius:20px;font-size:0.85rem;font-weight:700;backdrop-filter:blur(5px)}
.event-content{padding:20px}
.event-title{font-size:1.3rem;font-weight:700;margin-bottom:10px;color:var(--dark)}
.event-info{display:flex;align-items:center;gap:8px;color:var(--gray);font-size:0.95rem;margin-bottom:8px}
.event-info i{color:var(--primary);width:20px}
.event-price{display:flex;justify-content:space-between;align-items:center;margin-top:15px;padding-top:15px;border-top:2px solid var(--light)}
.price{font-size:1.5rem;font-weight:800;color:var(--primary)}
.btn-book{background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--white);border:none;padding:10px 25px;border-radius:var(--radius);font-weight:700;cursor:pointer;transition:all 0.3s}
.btn-book:hover{transform:scale(1.05)}
.no-results{text-align:center;padding:60px 20px;color:var(--gray)}
.no-results i{font-size:4rem;margin-bottom:20px;color:var(--primary);opacity:0.3}
.no-results p{font-size:1.2rem}
@media (max-width:768px){
.nav-toggle{display:block}
.nav-menu{position:fixed;top:70px;right:-100%;width:280px;height:calc(100vh - 70px);background:var(--white);flex-direction:column;padding:30px 20px;box-shadow:var(--shadow);transition:right 0.3s;overflow-y:auto}
.nav-menu.active{right:0}
.page-header h1{font-size:2rem}
.filters{flex-direction:column}
.filters select,.filters input,.filters button{width:100%}
.events-grid{grid-template-columns:1fr}
.user-info{width:100%}
}
</style>
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<a href="index.html" class="logo">
<i class="fas fa-ticket-alt"></i>
<span>NexEvent</span>
</a>
<button class="nav-toggle" id="navToggle">
<i class="fas fa-bars"></i>
</button>
<ul class="nav-menu" id="navMenu">
<li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
<li><a href="events.html" class="active"><i class="fas fa-calendar"></i> الفعاليات</a></li>
<li><a href="my-bookings.html"><i class="fas fa-ticket-alt"></i> حجوزاتي</a></li>
<li id="authLinks">
<a href="login.html"><i class="fas fa-sign-in-alt"></i> تسجيل الدخول</a>
</li>
<li id="userSection" style="display:none">
<div class="user-info">
<i class="fas fa-user-circle"></i>
<span id="userName"></span>
</div>
</li>
<li id="logoutSection" style="display:none">
<a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> خروج</a>
</li>
</ul>
</div>
</nav>
<div class="container">
<div class="page-header">
<h1>جميع الفعاليات</h1>
<p>اختر الفعالية المناسبة لك واحجز تذكرتك الآن</p>
</div>
<div class="filters">
<select id="filterCity">
<option value="">كل المدن</option>
<option value="الرياض" selected>الرياض</option>
<option value="جدة">جدة</option>
<option value="الدمام">الدمام</option>
</select>
<select id="filterCategory">
<option value="">كل الفئات</option>
<option value="حفلات">حفلات موسيقية</option>
<option value="مسرح">مسرح</option>
<option value="رياضة">رياضة</option>
<option value="عائلية">عائلية</option>
</select>
<input type="date" id="filterDate">
<button id="applyFilters"><i class="fas fa-filter"></i> تطبيق</button>
<button id="resetFilters" style="background:#e0e0e0;color:var(--dark)"><i class="fas fa-redo"></i> إعادة تعيين</button>
</div>
<div class="results-count" id="resultsCount"></div>
<div class="events-grid" id="eventsGrid"></div>
<div class="no-results" id="noResults" style="display:none">
<i class="fas fa-calendar-times"></i>
<p>لا توجد فعاليات متاحة</p>
</div>
</div>
<script>
// تهيئة البيانات إذا لم تكن موجودة
if(!localStorage.getItem('nexevent_events')){
const events=[
{id:1,title:'حفل عمرو دياب',category:'حفلات',city:'الرياض',date:'2025-02-15',price:450,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800',seats:5000,badge:'مميز',description:'استمتع بأجمل الأغاني مع الهضبة عمرو دياب في حفل استثنائي'},
{id:2,title:'مهرجان الرياض للطعام',category:'عائلية',city:'الرياض',date:'2025-02-20',price:80,venue:'واجهة الرياض',image:'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800',seats:10000,badge:'عائلي',description:'تذوق أشهى المأكولات من مطاعم عالمية ومحلية'},
{id:3,title:'حفل كاظم الساهر',category:'حفلات',city:'الرياض',date:'2025-03-01',price:500,venue:'مدينة الملك عبدالله المالية',image:'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=800',seats:8000,badge:'مميز',description:'أمسية موسيقية راقية مع قيصر الأغنية العربية'},
{id:4,title:'مسرحية اللوكاندة',category:'مسرح',city:'الرياض',date:'2025-02-25',price:150,venue:'مسرح بكر الشدي',image:'https://images.unsplash.com/photo-1503095396549-807759245b35?w=800',seats:1200,badge:'كوميدي',description:'عرض مسرحي كوميدي يجمع أشهر نجوم الكوميديا'},
{id:5,title:'بطولة الدوري السعودي',category:'رياضة',city:'الرياض',date:'2025-03-10',price:200,venue:'ملعب مرسول بارك',image:'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800',seats:25000,badge:'رياضي',description:'شاهد مباراة مثيرة في الدوري السعودي للمحترفين'},
{id:6,title:'ليلة الفن والثقافة',category:'عائلية',city:'الرياض',date:'2025-02-28',price:100,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800',seats:3000,badge:'ثقافي',description:'أمسية ثقافية وفنية تجمع الفن والأدب والموسيقى'},
{id:7,title:'حفل راشد الماجد',category:'حفلات',city:'الرياض',date:'2025-03-05',price:350,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800',seats:6000,badge:'مميز',description:'ليلة طربية مع فنان العرب راشد الماجد'},
{id:8,title:'معرض الكتاب الدولي',category:'عائلية',city:'الرياض',date:'2025-03-15',price:30,venue:'مركز الرياض الدولي',image:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',seats:50000,badge:'ثقافي',description:'أكبر معرض للكتاب بمشاركة دور نشر عالمية'}
];
localStorage.setItem('nexevent_events',JSON.stringify(events));
}

const events=JSON.parse(localStorage.getItem('nexevent_events')||'[]');

function checkAuth(){
const user=JSON.parse(localStorage.getItem('nexevent_currentUser')||'null');
const authLinks=document.getElementById('authLinks');
const userSection=document.getElementById('userSection');
const logoutSection=document.getElementById('logoutSection');
if(user){
authLinks.style.display='none';
userSection.style.display='block';
logoutSection.style.display='block';
document.getElementById('userName').textContent=user.fullName;
}else{
authLinks.style.display='block';
userSection.style.display='none';
logoutSection.style.display='none';
}
}

function renderEvents(eventsToRender){
const grid=document.getElementById('eventsGrid');
const noResults=document.getElementById('noResults');
const resultsCount=document.getElementById('resultsCount');
grid.innerHTML='';
if(eventsToRender.length===0){
noResults.style.display='block';
resultsCount.textContent='';
return;
}
noResults.style.display='none';
resultsCount.textContent=`${eventsToRender.length} فعالية متاحة`;
eventsToRender.forEach(event=>{
const card=document.createElement('div');
card.className='event-card';
card.onclick=()=>window.location.href=`event-details.html?id=${event.id}`;
card.innerHTML=`
<div class="event-image">
<img src="${event.image}" alt="${event.title}" onerror="this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800'">
<span class="event-badge">${event.badge}</span>
</div>
<div class="event-content">
<h3 class="event-title">${event.title}</h3>
<div class="event-info">
<i class="fas fa-map-marker-alt"></i>
<span>${event.venue}</span>
</div>
<div class="event-info">
<i class="fas fa-calendar"></i>
<span>${new Date(event.date).toLocaleDateString('ar-SA',{year:'numeric',month:'long',day:'numeric'})}</span>
</div>
<div class="event-info">
<i class="fas fa-users"></i>
<span>${event.seats.toLocaleString('ar-SA')} مقعد متاح</span>
</div>
<div class="event-price">
<span class="price">${event.price.toLocaleString('ar-SA')} ريال</span>
<button class="btn-book"><i class="fas fa-ticket-alt"></i> احجز</button>
</div>
</div>
`;
grid.appendChild(card);
});
}

document.addEventListener('DOMContentLoaded',()=>{
checkAuth();
renderEvents(events);
const navToggle=document.getElementById('navToggle');
const navMenu=document.getElementById('navMenu');
if(navToggle){
navToggle.addEventListener('click',()=>{
navMenu.classList.toggle('active');
});
}
document.getElementById('applyFilters').addEventListener('click',()=>{
const city=document.getElementById('filterCity').value;
const category=document.getElementById('filterCategory').value;
const date=document.getElementById('filterDate').value;
let filtered=events;
if(city)filtered=filtered.filter(e=>e.city===city);
if(category)filtered=filtered.filter(e=>e.category===category);
if(date)filtered=filtered.filter(e=>e.date===date);
renderEvents(filtered);
});
document.getElementById('resetFilters').addEventListener('click',()=>{
document.getElementById('filterCity').value='الرياض';
document.getElementById('filterCategory').value='';
document.getElementById('filterDate').value='';
renderEvents(events);
});
const logoutBtn=document.getElementById('logoutBtn');
if(logoutBtn){
logoutBtn.addEventListener('click',(e)=>{
e.preventDefault();
localStorage.removeItem('nexevent_currentUser');
window.location.href='index.html';
});
}
});
</script>
</body>
</html>
