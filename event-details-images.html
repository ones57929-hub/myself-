<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفاصيل الفعالية - NexEvent</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#9b59b6;--secondary:#8e44ad;--dark:#1a1a1a;--light:#f8f9fa;--white:#ffffff;--gray:#6c757d;--success:#28a745;--danger:#dc3545;--shadow:0 4px 6px rgba(0,0,0,0.1);--radius:12px}
body{font-family:'Cairo',sans-serif;background:var(--light);color:var(--dark);line-height:1.6}
.navbar{background:var(--white);box-shadow:var(--shadow);position:sticky;top:0;z-index:1000;padding:15px 0}
.nav-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:center;gap:10px;text-decoration:none}
.container{max-width:1200px;margin:0 auto;padding:40px 20px}
.breadcrumb{display:flex;align-items:center;gap:10px;margin-bottom:30px;color:var(--gray);font-size:0.95rem}
.breadcrumb a{color:var(--primary);text-decoration:none}
.event-details{display:grid;grid-template-columns:1fr 400px;gap:30px}
.event-main{background:var(--white);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.event-image{height:400px;background:linear-gradient(135deg,var(--primary),var(--secondary));position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.event-image img{width:100%;height:100%;object-fit:cover}
.event-badge{position:absolute;top:20px;right:20px;background:rgba(142,68,173,0.95);color:var(--white);padding:8px 20px;border-radius:25px;font-weight:700;backdrop-filter:blur(5px)}
.event-info{padding:40px}
.event-title{font-size:2.2rem;font-weight:800;margin-bottom:20px;color:var(--dark)}
.event-description{color:var(--gray);font-size:1.1rem;line-height:1.8;margin-bottom:30px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-bottom:30px}
.info-item{display:flex;align-items:center;gap:12px;padding:15px;background:var(--light);border-radius:var(--radius)}
.info-item i{font-size:1.5rem;color:var(--primary)}
.info-item div h4{font-size:0.85rem;color:var(--gray);margin-bottom:3px}
.info-item div p{font-weight:700;color:var(--dark)}
.event-sidebar{position:sticky;top:100px;height:fit-content}
.booking-card{background:var(--white);border-radius:var(--radius);padding:30px;box-shadow:var(--shadow)}
.booking-price{text-align:center;padding-bottom:25px;border-bottom:2px solid var(--light);margin-bottom:25px}
.booking-price .price{font-size:2.5rem;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--secondary));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.booking-price .label{color:var(--gray);font-size:0.95rem;margin-top:5px}
.quantity-selector{margin-bottom:25px}
.quantity-selector label{display:block;font-weight:600;margin-bottom:10px;color:var(--dark)}
.quantity-controls{display:flex;align-items:center;gap:15px;justify-content:center}
.quantity-controls button{width:45px;height:45px;border:none;background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--white);border-radius:50%;font-size:1.3rem;cursor:pointer;transition:all 0.3s}
.quantity-controls button:hover{transform:scale(1.1)}
.quantity-controls span{font-size:1.8rem;font-weight:700;min-width:50px;text-align:center}
.total-price{background:var(--light);padding:20px;border-radius:var(--radius);margin-bottom:25px;text-align:center}
.total-price .label{color:var(--gray);font-size:0.95rem;margin-bottom:5px}
.total-price .amount{font-size:2rem;font-weight:800;color:var(--primary)}
.btn-book-now{width:100%;background:linear-gradient(135deg,var(--primary),var(--secondary));color:var(--white);border:none;padding:18px;border-radius:var(--radius);font-size:1.2rem;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-book-now:hover{transform:translateY(-3px);box-shadow:0 10px 25px rgba(155,89,182,0.4)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:var(--white);border-radius:var(--radius);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
.modal-header{padding:25px;border-bottom:2px solid var(--light);display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:1.5rem;display:flex;align-items:center;gap:10px}
.modal-header h3 i{color:var(--primary)}
.modal-close{background:none;border:none;font-size:2rem;color:var(--gray);cursor:pointer;transition:all 0.3s}
.modal-close:hover{color:var(--danger)}
.modal-body{padding:30px}
.booking-summary{background:var(--light);padding:20px;border-radius:var(--radius);margin-bottom:25px}
.booking-summary h4{margin-bottom:15px;color:var(--dark)}
.summary-item{display:flex;justify-content:space-between;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #ddd}
.summary-item:last-child{border:none;margin:0;padding-top:10px;font-weight:700;font-size:1.1rem}
.payment-methods{margin-bottom:25px}
.payment-methods h4{margin-bottom:15px;color:var(--dark)}
.payment-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.payment-option{padding:15px;border:2px solid #e0e0e0;border-radius:var(--radius);cursor:pointer;text-align:center;transition:all 0.3s}
.payment-option:hover{border-color:var(--primary)}
.payment-option.selected{border-color:var(--primary);background:rgba(155,89,182,0.1)}
.payment-option i{font-size:2rem;margin-bottom:8px;color:var(--primary)}
.payment-option span{display:block;font-size:0.85rem;font-weight:600}
.btn-confirm{width:100%;background:var(--success);color:var(--white);border:none;padding:16px;border-radius:var(--radius);font-size:1.1rem;font-weight:700;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-confirm:hover{background:#218838;transform:translateY(-2px)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--white);padding:15px 25px;border-radius:var(--radius);box-shadow:0 10px 30px rgba(0,0,0,0.2);z-index:10000;opacity:0;transition:all 0.3s;display:flex;align-items:center;gap:12px}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.toast.success{border-right:4px solid var(--success)}
.toast.success i{color:var(--success)}
.toast.error{border-right:4px solid var(--danger)}
.toast.error i{color:var(--danger)}
@media (max-width:992px){
.event-details{grid-template-columns:1fr}
.event-sidebar{position:static}
}
@media (max-width:768px){
.event-image{height:250px}
.event-info{padding:25px}
.event-title{font-size:1.6rem}
.info-grid{grid-template-columns:1fr}
.payment-options{grid-template-columns:1fr}
}
</style>
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<a href="index.html" class="logo">
<i class="fas fa-ticket-alt"></i>
<span>NexEvent</span>
</a>
</div>
</nav>
<div class="container">
<div class="breadcrumb">
<a href="index.html"><i class="fas fa-home"></i> الرئيسية</a>
<i class="fas fa-chevron-left"></i>
<a href="events.html">الفعاليات</a>
<i class="fas fa-chevron-left"></i>
<span id="breadcrumbTitle">تفاصيل الفعالية</span>
</div>
<div class="event-details" id="eventDetails"></div>
</div>
<div class="modal" id="bookingModal">
<div class="modal-content">
<div class="modal-header">
<h3><i class="fas fa-ticket-alt"></i> إتمام الحجز</h3>
<button class="modal-close" onclick="closeModal()">&times;</button>
</div>
<div class="modal-body">
<div class="booking-summary">
<h4>ملخص الحجز</h4>
<div class="summary-item">
<span>الفعالية</span>
<span id="summaryTitle"></span>
</div>
<div class="summary-item">
<span>عدد التذاكر</span>
<span id="summaryQuantity"></span>
</div>
<div class="summary-item">
<span>سعر التذكرة</span>
<span id="summaryPrice"></span>
</div>
<div class="summary-item">
<span>الإجمالي</span>
<span id="summaryTotal"></span>
</div>
</div>
<div class="payment-methods">
<h4>طريقة الدفع</h4>
<div class="payment-options">
<div class="payment-option selected" data-method="mada">
<i class="fas fa-credit-card"></i>
<span>مدى</span>
</div>
<div class="payment-option" data-method="visa">
<i class="fab fa-cc-visa"></i>
<span>فيزا</span>
</div>
<div class="payment-option" data-method="apple">
<i class="fab fa-apple-pay"></i>
<span>Apple Pay</span>
</div>
</div>
</div>
<button class="btn-confirm" onclick="confirmBooking()">
<i class="fas fa-check-circle"></i>
<span>تأكيد الحجز والدفع</span>
</button>
</div>
</div>
</div>
<div class="toast" id="toast">
<i class="fas fa-check-circle"></i>
<span id="toastMessage"></span>
</div>
<script>
let currentEvent=null;
let quantity=1;
let selectedPayment='mada';

// تهيئة البيانات إذا لم تكن موجودة
if(!localStorage.getItem('nexevent_events')){
const events=[
{id:1,title:'حفل عمرو دياب',category:'حفلات',city:'الرياض',date:'2025-02-15',price:450,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1470229722913-7c0e2dbbafd3?w=800',seats:5000,badge:'مميز',description:'استمتع بأجمل الأغاني مع الهضبة عمرو دياب في حفل استثنائي'},
{id:2,title:'مهرجان الرياض للطعام',category:'عائلية',city:'الرياض',date:'2025-02-20',price:80,venue:'واجهة الرياض',image:'https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=800',seats:10000,badge:'عائلي',description:'تذوق أشهى المأكولات من مطاعم عالمية ومحلية'},
{id:3,title:'حفل كاظم الساهر',category:'حفلات',city:'الرياض',date:'2025-03-01',price:500,venue:'مدينة الملك عبدالله المالية',image:'https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?w=800',seats:8000,badge:'مميز',description:'أمسية موسيقية راقية مع قيصر الأغنية العربية'},
{id:4,title:'مسرحية اللوكاندة',category:'مسرح',city:'الرياض',date:'2025-02-25',price:150,venue:'مسرح بكر الشدي',image:'https://images.unsplash.com/photo-1503095396549-807759245b35?w=800',seats:1200,badge:'كوميدي',description:'عرض مسرحي كوميدي يجمع أشهر نجوم الكوميديا'},
{id:5,title:'بطولة الدوري السعودي',category:'رياضة',city:'الرياض',date:'2025-03-10',price:200,venue:'ملعب مرسول بارك',image:'https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=800',seats:25000,badge:'رياضي',description:'شاهد مباراة مثيرة في الدوري السعودي للمحترفين'},
{id:6,title:'ليلة الفن والثقافة',category:'عائلية',city:'الرياض',date:'2025-02-28',price:100,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1460661419201-fd4cecdf8a8b?w=800',seats:3000,badge:'ثقافي',description:'أمسية ثقافية وفنية تجمع الفن والأدب والموسيقى'},
{id:7,title:'حفل راشد الماجد',category:'حفلات',city:'الرياض',date:'2025-03-05',price:350,venue:'بوليفارد رياض سيتي',image:'https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=800',seats:6000,badge:'مميز',description:'ليلة طربية مع فنان العرب راشد الماجد'},
{id:8,title:'معرض الكتاب الدولي',category:'عائلية',city:'الرياض',date:'2025-03-15',price:30,venue:'مركز الرياض الدولي',image:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=800',seats:50000,badge:'ثقافي',description:'أكبر معرض للكتاب بمشاركة دور نشر عالمية'}
];
localStorage.setItem('nexevent_events',JSON.stringify(events));
}

function getEventById(id){
const events=JSON.parse(localStorage.getItem('nexevent_events')||'[]');
return events.find(e=>e.id==id);
}
function showToast(message,type='success'){
const toast=document.getElementById('toast');
const toastMessage=document.getElementById('toastMessage');
const icon=toast.querySelector('i');
toastMessage.textContent=message;
toast.className='toast '+type;
if(type==='success'){
icon.className='fas fa-check-circle';
}else{
icon.className='fas fa-exclamation-circle';
}
toast.classList.add('show');
setTimeout(()=>{
toast.classList.remove('show');
},3000);
}
function updateQuantity(delta){
quantity=Math.max(1,Math.min(10,quantity+delta));
document.getElementById('quantity').textContent=quantity;
updateTotalPrice();
}
function updateTotalPrice(){
if(!currentEvent)return;
const total=currentEvent.price*quantity;
document.getElementById('totalAmount').textContent=total.toLocaleString('ar-SA')+' ريال';
}
function openBookingModal(){
const user=JSON.parse(localStorage.getItem('nexevent_currentUser')||'null');
if(!user){
showToast('يجب تسجيل الدخول أولاً','error');
setTimeout(()=>{
window.location.href='login.html';
},1500);
return;
}
document.getElementById('summaryTitle').textContent=currentEvent.title;
document.getElementById('summaryQuantity').textContent=quantity+' تذكرة';
document.getElementById('summaryPrice').textContent=currentEvent.price.toLocaleString('ar-SA')+' ريال';
document.getElementById('summaryTotal').textContent=(currentEvent.price*quantity).toLocaleString('ar-SA')+' ريال';
document.getElementById('bookingModal').classList.add('active');
}
function closeModal(){
document.getElementById('bookingModal').classList.remove('active');
}
function confirmBooking(){
const user=JSON.parse(localStorage.getItem('nexevent_currentUser')||'null');
if(!user){
showToast('يجب تسجيل الدخول','error');
return;
}
const booking={
id:Date.now(),
userId:user.id,
eventId:currentEvent.id,
eventTitle:currentEvent.title,
eventDate:currentEvent.date,
eventVenue:currentEvent.venue,
eventImage:currentEvent.image,
quantity:quantity,
pricePerTicket:currentEvent.price,
totalPrice:currentEvent.price*quantity,
paymentMethod:selectedPayment,
status:'confirmed',
bookingDate:new Date().toISOString(),
qrCode:`QR-${Date.now()}`
};
const bookings=JSON.parse(localStorage.getItem('nexevent_bookings')||'[]');
bookings.push(booking);
localStorage.setItem('nexevent_bookings',JSON.stringify(bookings));
closeModal();
showToast('تم الحجز بنجاح! سيتم تحويلك لصفحة حجوزاتك','success');
setTimeout(()=>{
window.location.href='my-bookings.html';
},2000);
}
document.addEventListener('DOMContentLoaded',()=>{
const urlParams=new URLSearchParams(window.location.search);
const eventId=urlParams.get('id');
if(!eventId){
window.location.href='events.html';
return;
}
currentEvent=getEventById(eventId);
if(!currentEvent){
window.location.href='events.html';
return;
}
document.getElementById('breadcrumbTitle').textContent=currentEvent.title;
document.title=currentEvent.title+' - NexEvent';
const detailsContainer=document.getElementById('eventDetails');
detailsContainer.innerHTML=`
<div class="event-main">
<div class="event-image">
<img src="${currentEvent.image}" alt="${currentEvent.title}" onerror="this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800'">
<span class="event-badge">${currentEvent.badge}</span>
</div>
<div class="event-info">
<h1 class="event-title">${currentEvent.title}</h1>
<p class="event-description">${currentEvent.description}</p>
<div class="info-grid">
<div class="info-item">
<i class="fas fa-map-marker-alt"></i>
<div>
<h4>الموقع</h4>
<p>${currentEvent.venue}</p>
</div>
</div>
<div class="info-item">
<i class="fas fa-calendar"></i>
<div>
<h4>التاريخ</h4>
<p>${new Date(currentEvent.date).toLocaleDateString('ar-SA',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</p>
</div>
</div>
<div class="info-item">
<i class="fas fa-city"></i>
<div>
<h4>المدينة</h4>
<p>${currentEvent.city}</p>
</div>
</div>
<div class="info-item">
<i class="fas fa-users"></i>
<div>
<h4>المقاعد المتاحة</h4>
<p>${currentEvent.seats.toLocaleString('ar-SA')} مقعد</p>
</div>
</div>
</div>
</div>
</div>
<div class="event-sidebar">
<div class="booking-card">
<div class="booking-price">
<div class="price">${currentEvent.price.toLocaleString('ar-SA')} ريال</div>
<div class="label">سعر التذكرة الواحدة</div>
</div>
<div class="quantity-selector">
<label>عدد التذاكر</label>
<div class="quantity-controls">
<button onclick="updateQuantity(-1)"><i class="fas fa-minus"></i></button>
<span id="quantity">1</span>
<button onclick="updateQuantity(1)"><i class="fas fa-plus"></i></button>
</div>
</div>
<div class="total-price">
<div class="label">الإجمالي</div>
<div class="amount" id="totalAmount">${currentEvent.price.toLocaleString('ar-SA')} ريال</div>
</div>
<button class="btn-book-now" onclick="openBookingModal()">
<i class="fas fa-ticket-alt"></i>
<span>احجز الآن</span>
</button>
</div>
</div>
`;
const paymentOptions=document.querySelectorAll('.payment-option');
paymentOptions.forEach(option=>{
option.addEventListener('click',function(){
paymentOptions.forEach(opt=>opt.classList.remove('selected'));
this.classList.add('selected');
selectedPayment=this.dataset.method;
});
});
});
</script>
</body>
</html>
